<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>들어가주세요</title>
  <meta name="description" content="카네이션이 3D 하트로 변하며 스승의날 감사 인사를 전하는 웹사이트">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene" aria-label="카네이션이 3D 하트로 변하는 스승의날 감사 애니메이션"></canvas>
  <div id="completionWave" class="completion-wave" aria-hidden="true"></div>
  <div id="reveal" class="reveal" aria-live="polite">
    <span>희진쌤 항상 감사드리고</span>
    <span>스승의날 축하드립니다</span>
    <span class="hearts" aria-label="하트 세 개">❤️❤️❤️</span>
  </div>
  <script src="js/scene.js"></script>
</body>
</html>
